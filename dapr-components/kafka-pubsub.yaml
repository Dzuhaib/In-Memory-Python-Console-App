# Dapr Pub/Sub component for Kafka (Redpanda)
# Used by backend to publish task events and by consumer services to subscribe
#
# For local development (in-cluster Redpanda):
#   brokers: redpanda:9092, authType: none
#
# For cloud Kafka (Redpanda Cloud / Confluent):
#   Update brokers, authType, and SASL credentials below
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: todo-app
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "redpanda:9092"
    - name: consumerGroup
      value: "todo-service"
    - name: authType
      value: "none"
    - name: maxMessageBytes
      value: "1024000"
