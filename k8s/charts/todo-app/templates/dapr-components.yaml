# Dapr component templates: kafka-pubsub, statestore, kubernetes-secrets
---
# Kafka Pub/Sub Component
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: {{ .Values.namespace }}
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    {{- if and .Values.kafka .Values.kafka.cloud .Values.kafka.cloud.enabled }}
    # Cloud Kafka configuration (Redpanda Cloud / Confluent / Strimzi external)
    - name: brokers
      value: {{ .Values.kafka.cloud.bootstrapServers | quote }}
    - name: authType
      value: "password"
    - name: saslUsername
      secretKeyRef:
        name: redpanda-kafka-credentials
        key: sasl-username
    - name: saslPassword
      secretKeyRef:
        name: redpanda-kafka-credentials
        key: sasl-password
    - name: saslMechanism
      value: {{ .Values.kafka.cloud.sasl.mechanism | default "SCRAM-SHA-256" | quote }}
    {{- if .Values.kafka.cloud.tls.enabled }}
    - name: requiredAcks
      value: "all"
    {{- end }}
    {{- else }}
    # Local Kafka configuration (in-cluster Redpanda or Strimzi)
    - name: brokers
      value: "{{ .Values.redpanda.name }}:9092"
    - name: authType
      value: "none"
    {{- end }}
    - name: consumerGroup
      value: "todo-service"
    - name: maxMessageBytes
      value: "1024000"
---
# PostgreSQL State Store Component
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: {{ .Values.namespace }}
spec:
  type: state.postgresql
  version: v1
  metadata:
    - name: connectionString
      secretKeyRef:
        name: {{ .Values.backend.name }}-secrets
        key: DATABASE_URL
---
# Kubernetes Secrets Store Component
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: {{ .Values.namespace }}
spec:
  type: secretstores.kubernetes
  version: v1
  metadata: []
