{{- if or .Values.backend.secrets.DATABASE_URL .Values.backend.secrets.OPENAI_API_KEY }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.name }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "todo-app.backend.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.backend.secrets.DATABASE_URL }}
  DATABASE_URL: {{ .Values.backend.secrets.DATABASE_URL | b64enc | quote }}
  {{- end }}
  {{- if .Values.backend.secrets.OPENAI_API_KEY }}
  OPENAI_API_KEY: {{ .Values.backend.secrets.OPENAI_API_KEY | b64enc | quote }}
  {{- end }}
{{- end }}
