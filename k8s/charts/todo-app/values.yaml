# Default values for todo-app Helm chart
# This is a YAML-formatted file.

# Global settings
namespace: todo-app
environment: development

# Backend configuration
backend:
  name: todo-backend
  replicas: 1
  image:
    repository: todo-backend
    tag: local
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  config:
    LOG_LEVEL: "INFO"
    PORT: "8000"
    HOST: "0.0.0.0"
    CORS_ORIGINS: "http://frontend-service:3000"
  # Secrets - should be provided via --set or external secret management
  secrets:
    DATABASE_URL: ""
    OPENAI_API_KEY: ""
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

# Frontend configuration
frontend:
  name: todo-frontend
  replicas: 1
  image:
    repository: todo-frontend
    tag: local
    pullPolicy: Never
  service:
    type: NodePort
    port: 3000
    nodePort: 30000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  config:
    NEXT_PUBLIC_API_URL: "http://backend-service:8000/api/v1"
  probes:
    liveness:
      path: /
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

# Redpanda configuration (Kafka-compatible streaming)
redpanda:
  name: redpanda
  replicas: 1
  image:
    repository: docker.redpanda.com/redpandadata/redpanda
    tag: v24.2.4
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Notification Service configuration
notificationService:
  name: notification-service
  replicas: 1
  image:
    repository: notification-service
    tag: local
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8002
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

# Recurring Task Service configuration
recurringTaskService:
  name: recurring-task-service
  replicas: 1
  image:
    repository: recurring-task-service
    tag: local
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8003
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

# Audit Service configuration
auditService:
  name: audit-service
  replicas: 1
  image:
    repository: audit-service
    tag: local
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

# WebSocket Service configuration
websocketService:
  name: websocket-service
  replicas: 1
  image:
    repository: websocket-service
    tag: local
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8004
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
